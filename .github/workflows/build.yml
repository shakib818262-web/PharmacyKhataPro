name: Build PharmacyKhata Pro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The old app failed CI here: its debug signing pointed at a gitignored
      # debug.keystore that CI never created. This app uses Gradle's DEFAULT debug
      # signing, but we also generate ~/.android/debug.keystore explicitly so the
      # build never depends on runner state.
      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # google-services.json comes from a CI secret when available; otherwise a
      # placeholder is generated so the build compiles anywhere. IMPORTANT: unlike
      # the old app's mock, this placeholder INCLUDES a web oauth_client (client_type 3),
      # which makes R.string.default_web_client_id resolve. App code must not depend
      # on Google sign-in in CI builds.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "pharmacykhata-pro-ci",
              "storage_bucket": "pharmacykhata-pro-ci.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.shakib.pharmacykhata" }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [ { "current_key": "CI_PLACEHOLDER_NOT_A_REAL_KEY" } ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      # This snapshot is pushed through the GitHub connector, which transfers
      # text files only, so gradle-wrapper.jar is not in the repo. CI installs
      # Gradle 8.9 directly (same version as the wrapper properties) instead.
      # Locally, run `gradle wrapper --gradle-version 8.9` once to regenerate
      # the wrapper jar if you want to use ./gradlew.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacykhata-pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
